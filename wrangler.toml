name = "meum-diarium"
compatibility_date = "2025-12-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Disable Cloudflare Analytics
[analytics]
enabled = false

# Pages Functions configuration
[functions]
# The functions directory is automatically detected by Cloudflare Pages

# D1 Database bindings
[[d1_databases]]
binding = "DB"
database_name = "meum-diarium"
database_id = "0cf71203-f07c-46b2-8f52-765929a25d24"
migrations_dir = "drizzle"

[[d1_databases]]
binding = "vocab"
database_name = "vocab"
database_id = "6743a774-21c1-4c0c-a17a-086eae15d3f5"
migrations_dir = "drizzle"

# Environment variables for Pages
[vars]
ENVIRONMENT = "production"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
